services:
  postgres:
    image: postgres:16-alpine
    container_name: cursor_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cursor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cursor}
      POSTGRES_DB: ${POSTGRES_DB:-cursor_pagination}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=1GB"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cursor_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cursor}:${POSTGRES_PASSWORD:-cursor}@postgres:5432/${POSTGRES_DB:-cursor_pagination}
      ASYNCPG_URL: postgresql://${POSTGRES_USER:-cursor}:${POSTGRES_PASSWORD:-cursor}@postgres:5432/${POSTGRES_DB:-cursor_pagination}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro

volumes:
  pgdata:
