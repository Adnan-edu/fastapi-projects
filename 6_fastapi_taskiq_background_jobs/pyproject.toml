[project]
name = "fastapi-taskiq-background-jobs"
version = "0.1.0"
description = "Learn background task queues in FastAPI using Taskiq with Redis broker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "taskiq-fastapi>=0.3.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"