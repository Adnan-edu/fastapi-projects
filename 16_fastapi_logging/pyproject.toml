[project]
name = "16-fastapi-logging"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "logfire[fastapi,system-metrics]>=4.37.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.13.1",
    "sentry-sdk[fastapi]>=2.62.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.logfire]
ignore_no_config = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
