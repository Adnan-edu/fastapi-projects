[project]
name = "fastapi-redis-cache2"
version = "0.1.0"
description = "Learn caching in FastAPI using Redis and fastapi-cache2 with a Weather Forecast API Simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fastapi-cache2>=0.2.2",
    "redis>=5.0.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
