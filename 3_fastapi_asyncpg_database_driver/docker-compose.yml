services:
  postgres:
    image: postgres:16-alpine
    container_name: product_inventory_db
    environment:
      POSTGRES_USER: productuser
      POSTGRES_PASSWORD: productpass
      POSTGRES_DB: productdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_products_table.sql:/docker-entrypoint-initdb.d/001_create_products_table.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productuser -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: